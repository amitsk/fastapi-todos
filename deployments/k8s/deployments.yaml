apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-todos
  labels:
    app: fastapi-todos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastapi-todos
  template:
    metadata:
      labels:
        app: fastapi-todos
    spec:
      containers:
        - name: fastapi-todos
          image: fastapi/todos
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: LOG_LEVEL
              value: "INFO"
            - name: WEB_CONCURRENCY
              value: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
